# Alembic configuration for the AI Vendor Outreach Platform.
# The URL is read from the application settings (env var DATABASE_URL),
# see alembic/env.py. Keep secrets only in the environment.

[alembic]
script_location = alembic
prepend_sys_path = .
# sqlalchemy.url is intentionally NOT set here; env.py resolves it from
# app.config.Settings so DATABASE_URL stays the single source of truth.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S