# Reverse proxy for the AI Vendor Outreach Platform - plain HTTP listener.
#   /.well-known/acme-challenge/ -> webroot served to Certbot (Let's Encrypt)
#   /            -> Next.js frontend  (frontend:3000)
#   /api         -> FastAPI backend   (api:8000)     (api/health, api/docs ...)
#   /health      -> backend liveness probe
#   /ready       -> backend readiness probe (DB + Redis)
#
# HTTPS (443) is added by scripts/install.sh in a generated ssl.conf
# (template: ssl.conf.tpl). Both listeners use the same upstreams.
server {
    listen 80;
    server_name _;

    # ---- Let's Encrypt HTTP-01 challenge (webroot) ----
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    # ---- API ----
    location /api/ {
        proxy_pass http://api:8000;
        include /etc/nginx/conf.d/proxy_headers.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---- Health / readiness probes ----
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /ready {
        proxy_pass http://api:8000/ready;
        proxy_set_header Host $host;
        access_log off;
        proxy_read_timeout 10s;
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://frontend:3000;
        include /etc/nginx/conf.d/proxy_headers.conf;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}