# Reverse proxy for the AI Vendor Outreach Platform.
#   /            -> Next.js frontend  (frontend:3000)
#   /api         -> FastAPI backend   (api:8000)     (api/health, api/docs ...)
#   /health      -> backend liveness probe
#   /ready       -> backend readiness probe (DB + Redis)
server {
    listen 80;
    server_name _;

    # ---- API ----
    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    # ---- Health / readiness probes ----
    location = /health {
        proxy_pass http://api:8000/health;
        proxy_set_header Host $host;
        access_log off;
    }
    location = /ready {
        proxy_pass http://api:8000/ready;
        proxy_set_header Host $host;
        access_log off;
        proxy_read_timeout 10s;
    }

    # ---- Frontend ----
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}